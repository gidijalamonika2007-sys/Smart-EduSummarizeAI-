{% extends "base.html" %}
{% block title %}Create Account - EduSummarize AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill display-5 text-primary"></i>
                    <h3 class="mt-2">Create Your Account</h3>
                    <p class="text-muted mb-0">Save your videos, results and progress.</p>
                </div>

                <form action="{{ url_for('register_page') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                               minlength="3" maxlength="30" required autofocus
                               placeholder="e.g. student01">
                        <div class="form-text">3-30 characters: letters, numbers, - or _</div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email <span class="text-muted">(optional)</span></label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="you@example.com">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               minlength="6" required placeholder="At least 6 characters">
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password"
                               name="confirm_password" minlength="6" required
                               placeholder="Repeat your password">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-person-plus"></i> Register
                        </button>
                    </div>
                </form>

                <p class="text-center text-muted mt-3 mb-0">
                    Already have an account?
                    <a href="{{ url_for('login_page') }}">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
